<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,.16)"/>
      <stop offset="1" stop-color="rgba(255,255,255,.08)"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="rgba(255,255,255,.85)"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <circle cx="140" cy="120" r="160" fill="rgba(255,255,255,.07)"/>
  <circle cx="1080" cy="520" r="190" fill="rgba(255,255,255,.05)"/>

  <text x="600" y="70" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700" fill="#fff">scrcpy 无线投屏局域网拓扑</text>
  <text x="600" y="102" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="rgba(255,255,255,.75)">同一 WiFi · 无需 Root · 无需安装 App</text>

  <g font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- 手机 -->
    <g>
      <rect x="60" y="230" width="220" height="170" rx="20" fill="url(#card)" stroke="rgba(255,255,255,.65)" stroke-width="2.5"/>
      <rect x="120" y="262" width="100" height="150" rx="14" fill="rgba(255,255,255,.22)" stroke="#fff" stroke-width="3"/>
      <rect x="128" y="272" width="84" height="120" rx="6" fill="rgba(255,255,255,.35)"/>
      <line x1="158" y1="398" x2="182" y2="398" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="170" y="428" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">📱 手机</text>
      <text x="170" y="452" text-anchor="middle" font-size="13.5" fill="rgba(255,255,255,.78)">192.168.1.100</text>
      <text x="170" y="472" text-anchor="middle" font-size="12.5" fill="rgba(255,255,255,.6)">开启「无线调试」</text>
    </g>

    <!-- 路由器 -->
    <g>
      <rect x="440" y="230" width="240" height="170" rx="20" fill="url(#card)" stroke="rgba(255,255,255,.65)" stroke-width="2.5"/>
      <rect x="505" y="272" width="110" height="34" rx="10" fill="rgba(255,255,255,.25)" stroke="#fff" stroke-width="3"/>
      <g stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none">
        <path d="M528 290 l18 -12 l18 12"/>
        <path d="M576 290 l18 -12 l18 12"/>
      </g>
      <text x="560" y="348" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">🌐 路由器 / AP</text>
      <text x="560" y="372" text-anchor="middle" font-size="13.5" fill="rgba(255,255,255,.78)">192.168.1.1 · 同一 WiFi</text>
      <text x="560" y="392" text-anchor="middle" font-size="12.5" fill="rgba(255,255,255,.6)">⚠️ 关闭 AP 隔离</text>
    </g>

    <!-- 电脑 -->
    <g>
      <rect x="840" y="230" width="220" height="170" rx="20" fill="url(#card)" stroke="rgba(255,255,255,.65)" stroke-width="2.5"/>
      <rect x="870" y="260" width="160" height="110" rx="8" fill="rgba(255,255,255,.22)" stroke="#fff" stroke-width="3"/>
      <rect x="880" y="270" width="140" height="82" rx="4" fill="rgba(255,255,255,.35)"/>
      <line x1="910" y1="382" x2="990" y2="382" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <line x1="935" y1="392" x2="965" y2="392" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="950" y="428" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">🖥️ 电脑</text>
      <text x="950" y="452" text-anchor="middle" font-size="13.5" fill="rgba(255,255,255,.78)">192.168.1.101 · Windows</text>
      <text x="950" y="472" text-anchor="middle" font-size="12.5" fill="rgba(255,255,255,.6)">运行 scrcpy / start-scrcpy.bat</text>
    </g>

    <!-- 连接线 -->
    <g stroke="rgba(255,255,255,.85)" stroke-width="3.5" fill="none">
      <path d="M280 315 q75 -12 160 0" marker-end="url(#arrow)"/>
      <path d="M680 315 q75 -12 160 0" marker-end="url(#arrow)"/>
    </g>

    <g font-size="14" fill="rgba(255,255,255,.92)" font-weight="600">
      <text x="360" y="300" text-anchor="middle">WiFi · 同一局域网</text>
      <text x="760" y="300" text-anchor="middle">WiFi · 同一局域网</text>
    </g>
    <g font-size="12.5" fill="rgba(255,255,255,.65)">
      <text x="360" y="320" text-anchor="middle">adb pair / connect</text>
      <text x="760" y="320" text-anchor="middle">adb over WiFi</text>
    </g>

    <text x="600" y="560" text-anchor="middle" font-size="15" fill="rgba(255,255,255,.8)">核心：手机与电脑连入同一个路由器；配对一次 → 每次连接 → 一键投屏</text>
  </g>
</svg>
