<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <radialGradient id="hubGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <circle cx="150" cy="90" r="150" fill="rgba(255,255,255,.07)"/>
  <circle cx="1080" cy="530" r="190" fill="rgba(255,255,255,.05)"/>
  <circle cx="600" cy="300" r="260" fill="url(#hubGlow)"/>

  <!-- 中心枢纽：路由分流核心 -->
  <circle cx="600" cy="300" r="62" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.65)" stroke-width="5"/>
  <circle cx="600" cy="300" r="46" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-dasharray="7 10"/>
  <g stroke="#ffffff" stroke-width="10" stroke-linecap="round">
    <line x1="575" y1="300" x2="625" y2="300"/>
    <line x1="600" y1="275" x2="600" y2="325"/>
  </g>

  <!-- 三个出口：proxy / direct / block -->
  <g fill="none" stroke="rgba(255,255,255,.55)" stroke-width="6">
    <path d="M600 355 Q600 420 520 470"/>
    <path d="M600 355 Q600 420 680 470"/>
    <path d="M655 255 Q740 200 830 210"/>
  </g>

  <g stroke="rgba(255,255,255,.9)" stroke-width="7">
    <circle cx="520" cy="470" r="18" fill="#a78bfa"/>
    <circle cx="680" cy="470" r="18" fill="#a78bfa"/>
    <circle cx="830" cy="210" r="16" fill="#a78bfa"/>
  </g>

  <!-- 远端网络节点 -->
  <g fill="none" stroke="rgba(255,255,255,.4)" stroke-width="4">
    <path d="M530 452 L420 380"/>
    <path d="M690 452 L790 380"/>
    <path d="M818 218 L950 250"/>
  </g>
  <g stroke="rgba(255,255,255,.75)" stroke-width="5">
    <circle cx="420" cy="380" r="11" fill="#a78bfa"/>
    <circle cx="790" cy="380" r="11" fill="#a78bfa"/>
    <circle cx="950" cy="250" r="11" fill="#a78bfa"/>
  </g>

</svg>
